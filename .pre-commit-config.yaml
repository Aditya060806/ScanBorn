repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json
      - id: check-toml

  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
        args: [--line-length=100]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=100, --extend-ignore=E203,W503]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        # No --strict here, deliberately. This hook used to pass it while
        # [tool.mypy] in pyproject.toml turns strictness off, so `make lint` and
        # `git commit` disagreed and the hook blocked every commit: --strict
        # currently reports 595 errors, 457 of which are just missing annotations
        # (no-untyped-def, no-untyped-call). Annotating the stages is a real
        # project, not a pre-commit gate. Reading config from pyproject keeps the
        # two in step; re-enable strictness per-package there as each grows types.
        args: [--ignore-missing-imports]
        additional_dependencies: [types-PyYAML]
