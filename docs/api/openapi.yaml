components:
  schemas:
    Body_capture_capture_post:
      properties:
        file:
          anyOf:
          - type: string
            format: binary
          - type: 'null'
          title: File
      type: object
      title: Body_capture_capture_post
    Body_capture_import_capture__scan_id__import_post:
      properties:
        file:
          anyOf:
          - type: string
            format: binary
          - type: 'null'
          title: File
      type: object
      title: Body_capture_import_capture__scan_id__import_post
    Body_capture_import_capture_import_post:
      properties:
        file:
          anyOf:
          - type: string
            format: binary
          - type: 'null'
          title: File
      type: object
      title: Body_capture_import_capture_import_post
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    MissionRequest:
      properties:
        twin_id:
          type: string
          title: Twin Id
        goal:
          anyOf:
          - items:
              type: number
            type: array
            maxItems: 2
            minItems: 2
          - type: 'null'
          title: Goal
          description: '[x, y] in metres, map frame. Give this or task_graph_id.'
        task_graph_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Task Graph Id
          description: 'Take the route from a plan: its last navigate_to target is the goal and earlier
            ones are via points, in order. Every step must be navigate_to, and every target must name
            one object in this scan.'
        start:
          anyOf:
          - items:
              type: number
            type: array
            maxItems: 3
            minItems: 2
          - type: 'null'
          title: Start
          description: '[x, y] or [x, y, heading in radians]. Defaults to the scan''s home pose; without
            one it is required.'
        via:
          items:
            items:
              type: number
            type: array
            maxItems: 2
            minItems: 2
          type: array
          maxItems: 16
          title: Via
          description: Points to pass through, in order.
      type: object
      required:
      - twin_id
      title: MissionRequest
      description: Where the robot starts, where it should end up, and what it must pass on the way.
    RobotRequest:
      properties:
        kind:
          type: string
          enum:
          - rover
          - fake_rover
          title: Kind
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
          description: http://host[:port] of an ESP32 rover. Not used for fake_rover.
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        time_scale:
          type: number
          maximum: 50.0
          minimum: 1.0
          title: Time Scale
          description: 'fake_rover only: run its model this many times faster than real time.'
          default: 1.0
      type: object
      required:
      - kind
      title: RobotRequest
      description: 'A protocol rover to register: an ESP32 at `address`, or a fake rover run in-process.'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
