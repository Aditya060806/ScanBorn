      summary: Plan Preview
      description: 'Plan an instruction without a scanned room, for the landing page playground.


        Same provider chain and contract as /plan, but nothing is stored and no job is recorded:

        there is no twin for it to belong to. `labels` optionally stands in for a scene''s objects

        (one entry per object). A plan that needs clarification or recognises no action is still a

        200 here, with `status` and `problems` saying why; only a failed or cancelled chain is not.'
      operationId: plan_preview_plan_preview_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Body
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /plan:
    post:
      summary: Plan
      description: 'Turn an instruction into a task graph for this twin, through the planner chain.


        Only a plan whose every step is supported and whose every target names exactly one object in

        this scan is stored. A plan that needs clarification (a missing, absent or shared target)

        or recognises no action is a 422 that says why; nothing is stored and nothing is guessed.'
      operationId: plan_plan_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Body
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /providers/requests/{request_id}/cancel:
    post:
      summary: Cancel Provider Request
      description: 'Stop a running planner or profiler chain between attempts. A request already sent
        to a

        remote provider finishes or times out; its reply is then discarded.'
      operationId: cancel_provider_request_providers_requests__request_id__cancel_post
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /twins/{twin_id}/navmesh:
    get:
      summary: Twin Navmesh
      description: 'The twin''s occupancy grid for the mission map.


        `cells_b64` holds FREE 0 / BLOCKED 1 / UNKNOWN 2 per cell; `band_b64` marks free cells the

        robot still does not fit in (closer than its radius to something). Both are uint8,

        base64, row-major, with row 0 at the minimum y.'
      operationId: twin_navmesh_twins__twin_id__navmesh_get
      parameters:
      - name: twin_id
        in: path
        required: true
        schema:
          type: string
          title: Twin Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /missions/{mission_id}:
    get:
      summary: Get Mission
      operationId: get_mission_missions__mission_id__get
      parameters:
      - name: mission_id
        in: path
        required: true
        schema:
          type: string
          title: Mission Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /robot-specs/{name}:
    get:
      summary: Robot Spec
      description: robot/specs/<name>.yaml. `source` says whether its numbers are measured or placeholders.
      operationId: robot_spec_robot_specs__name__get
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /train:
    post:
      summary: Train
      description: 'Behaviour-clone the controller in the rover model and gate the result.


        With a mission, the policy must reach the goal in at least MISSION_GATE of the noisy runs of

        that mission; without one, SIM_GATE of random starts. A 409 carries the numbers, including

        how the failed runs ended. Noise comes from the robot spec, which labels it as assumed until

        calibration measures it. Optional robot_id selects its accepted calibration revision;

        robot_spec is the stable specification ID, not its display name.'
      operationId: train_train_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Body
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /optimize:
    post:
      summary: Optimize
      operationId: optimize_optimize_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Body
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /benchmarks:
    get:
      summary: Benchmarks
      description: 'Measured numbers for the dashboard''s Telemetry panel.


        `models` is written by `python -m deployment.aihub_export.profile_models` and is empty

        until that has been run: an empty payload means "not profiled yet", never zero. `phone`

        is benchmarks/phone.json, the on-device model measured on the project''s phone, or None.'
      operationId: benchmarks_benchmarks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /robots/{robot_id}/status:
    get:
      summary: Robot Status
      operationId: robot_status_robots__robot_id__status_get
      parameters:
      - name: robot_id
        in: path
        required: true
        schema:
          type: string
          title: Robot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /robots/{robot_id}/estop:
    post:
      summary: Robot Estop
      description: E-STOP a rover. It latches on the rover until reset; a live drive on it ends as `estop`.
      operationId: robot_estop_robots__robot_id__estop_post
      parameters:
      - name: robot_id
        in: path
        required: true
        schema:
          type: string
          title: Robot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /robots/{robot_id}/reset:
    post:
      summary: Robot Reset
      description: Clear a latched E-STOP or error. The rover refuses while it is driving.
      operationId: robot_reset_robots__robot_id__reset_post
      parameters:
      - name: robot_id
        in: path
        required: true
        schema:
          type: string
          title: Robot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /robots/{robot_id}/calibrate:
    post:
      summary: Robot Calibrate
      description: Run a calibration move (`straight` or `spin`). Turning it into spec values is Phase
