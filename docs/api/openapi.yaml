              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sync:
    post:
      summary: Sync
      operationId: sync_sync_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Body
        required: true
      responses:
