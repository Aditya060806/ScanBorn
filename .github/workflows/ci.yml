name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  dashboard-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify application source completeness
        run: python scripts/check_source_completeness.py
      - name: Test and package both viewer entry points
        working-directory: dashboard
        run: |
          npm ci
          npm test
          npm run build
          npm run build:viewer
      - name: Install declared Android build tools
        run: sdkmanager "platforms;android-36" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Android tests and compilation without model weights
        working-directory: MOBILE-APP
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make install-dev

      - name: Lint with flake8 + mypy
        run: make lint

      # Not gated yet: the tree has never been black-formatted (22 files would
      # change). Run `make format` once, commit it alone, then enable this step.
      # - name: Check formatting with black + isort
      #   run: make format-check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make install-dev

      - name: Run tests with coverage
        run: |
          pytest --cov-report=xml

      - name: Get pinned headers for firmware calibration host checks
        if: matrix.python-version == '3.11'
        uses: actions/checkout@v4
        with:
          repository: bblanchon/ArduinoJson
          ref: v7.4.3
          path: build/ArduinoJson
          persist-credentials: false
      - name: Firmware math, freshness and production calibration fault checks
        if: matrix.python-version == '3.11'
        env:
          SCANBORN_ARDUINOJSON: build/ArduinoJson/src
        run: python -m nox -s firmware_host firmware_calibration_host firmware_safety_host

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make install-dev

      - name: Security check with bandit
        run: bandit -r sdk/ orchestrator/ capture/ reconstruction/ semantic/ robot/ sarvam/ twin/ policy/ deployment/ -ll
