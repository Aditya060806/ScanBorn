# The orchestrator is the whole backend: it serves capture, reconstruction, segmentation, twins,
# missions, training, optimisation and rover deployments in one process on SQLite. The dashboard
# runs from dashboard/ (npm run dev) and the phone app talks to this port directly.
#
#   docker compose -f docker/docker-compose.yml up --build
#
# A phone or a rover must reach the host's LAN address on 8000 (HTTP) and 5005 (UDP telemetry),
# so allow both through the host firewall.
services:
  orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.orchestrator
    ports:
      - "8000:8000"
      - "5005:5005/udp"
    volumes:
      - scanborn_data:/data

volumes:
  scanborn_data:
