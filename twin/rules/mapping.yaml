# Label -> prefab name and primitive collider for scene.json (twin/generator.py).
# The names use Unity's vocabulary for an engine importer; none exists in this repository.
mappings:
  - label: wall
    prefab: Walls/InteriorWall
    collider: BoxCollider
  - label: floor
    prefab: Floors/TileFloor
    collider: BoxCollider
  - label: door
    prefab: Doors/PivotDoor
    collider: MeshCollider
  - label: window
    prefab: Windows/FixedWindow
    collider: BoxCollider
  - label: chair
    prefab: Furniture/OfficeChair
    collider: MeshCollider
  - label: table
    prefab: Furniture/RectTable
    collider: BoxCollider
  - label: shelf
    prefab: Storage/IndustrialShelf
    collider: MeshCollider
  - label: cabinet
    prefab: Storage/LockerCabinet
    collider: BoxCollider
  - label: robot
    prefab: Robots/ScanBornRobot
    collider: CapsuleCollider
